name: Frontend CI
on:
  workflow_dispatch:
  pull_request:
  push:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
